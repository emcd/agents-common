# Copier data file: single-source instructions migration.
#
# Downstream projects updating across the instructions retirement pass
# this file to pick up renamed answers instead of keeping stale values:
#
#   copier update \
#       --data-file https://raw.githubusercontent.com/emcd/agents-common/<ref>/.auxiliary/data/copier/single-source-instructions.yaml \
#       --answers-file .auxiliary/configuration/copier-answers--agents.yaml \
#       --skip-answered
#
# Replace <ref> with the agents template tag under adoption. Without
# this file, copier preserves the recorded answers, which silently
# keeps the retired layout (see below).
#
# Where things live after updating to the latest template:
#
# - `.auxiliary/agents/standards/` holds the 21 staged instruction
#   guides (Markdown). This directory is populate-created from this
#   repository's `distribution/.../instructions/`, never templated:
#   the template tree deliberately contains zero `standards` paths.
# - `.auxiliary/agents/skills/`, coder `prompt/` resources, and the
#   standards above are populate-managed and git-excluded (see
#   `.git/info/exclude`, managed block). The generated `AGENTS.md`
#   entrypoint references the standards per language.
# - Coder `settings.json` / `settings.jsonc` / `config.toml`, Starlark
#   rules, and MCP server configs are template-rendered and tracked.
#
# What must no longer exist after the update:
#
# - `instructions_sources` and `provide_instructions` answers keys.
#   Removed questions auto-drop from answers on update; no data file
#   entry is needed (or possible) for removals.
# - `coders/*/agents`, `coders/*/commands` (and opencode singular
#   `agent`/`command`) directories. Commands and subagents were
#   retired: delete leftover tracked copies outright. Do NOT add
#   exclude entries for them — removed means absent, not excluded.
# - `.auxiliary/instructions/`, the retired instruction home. Populate
#   copies but never deletes, so remove the stale tree by hand after
#   pointing `instructions_target` here.
# - `*.rst` files under standards directories (legacy translations
#   predating the Markdown migration).
#
# Custom (project-owned) skills live in `.auxiliary/agents/skills/<name>/`
# (directory package with SKILL.md, or flat `<name>.md` — the same
# shapes populate installs). Populate merges distribution skills into
# that tree and never deletes foreign entries; only the per-coder
# `skills/` discovery symlinks are replaced. Move any custom skills
# out of `coders/*/skills/` before populating — or delete them
# outright if vestigial (e.g. retired directory packages populate
# will not otherwise remove).
# Check whether `.claude/`, `.opencode/`, and root memory files are
# symlinks or legacy real directories/files: populate retargets a
# wrong symlink but only warns and skips a real path, so a legacy
# real directory would block its managed symlink from ever
# materializing. Remove legacy real paths by hand (after rescuing
# anything project-owned) before populating.
#
# Run `copier update` and `agentsmgr populate` together before
# committing, so generated state and exclusions land in the same
# changeset. Committing the update first leaves downstream clones
# holding half-migrated trees. Populate from this repository's
# `distribution/` tree (which holds `per-project/`), not the repo
# root: `agentsmgr populate project <source>/distribution <target>`.
# Order matters inside the combined step: update first, then
# populate. Populate aborts with Memory File Absence when
# `.auxiliary/agents/agents.md` does not exist yet, and that file
# is rendered by the template update.
#
# Rollback of the data-file answers alone is re-running the update
# without it; rollback of populated content is deleting the managed
# trees and re-populating.
instructions_target: .auxiliary/agents/standards
