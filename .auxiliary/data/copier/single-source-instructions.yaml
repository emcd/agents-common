# Copier data file: renamed answers for the instructions migration.
#
# Runbook pointer: template/documentation/applying-template-updates.md
# (in the agents-common repository at the tag under adoption) is the
# update + populate procedure. This file carries answers only.
#
# Usage (Copier requires a local file, not a URL — download to a
# unique owned temp path outside the worktree so concurrent updates
# cannot share or clobber it, then clean up only that path):
#   DATA_FILE="$(mktemp)" || exit 1
#   trap 'rm -f "$DATA_FILE"' EXIT INT TERM
#   python3 -c "import sys, urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/emcd/agents-common/<ref>/.auxiliary/data/copier/single-source-instructions.yaml', sys.argv[1])" "$DATA_FILE"
#   copier update \
#       --data-file "$DATA_FILE" \
#       --answers-file .auxiliary/configuration/copier-answers--agents.yaml \
#       --skip-answered
#
# Replace <ref> with the agents template tag under adoption — and see
# the runbook for when to track latest versus pin --vcs-ref.
instructions_target: .auxiliary/agents/standards
