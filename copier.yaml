_min_copier_version: "9.0"
_answers_file: .auxiliary/configuration/copier-answers--agents.yaml
_subdirectory: template

# Project-owned; seed on first copy / when absent; never overwrite on update.
_skip_if_exists:
    - .auxiliary/agents/project.md

project_name:
    type: str
    help: Project directory or Git repository name
    validator: >-
        {% if not (project_name | regex_search("^[a-z][a-z0-9-]*$")) %}
        Project name must contain only lowercase letters, numbers, and hyphens
        {% endif %}

languages:
    type: str
    help: Programming languages used in this project
    multiselect: true
    choices:
        - python
        - rust
    default:
        - python

coders:
    type: str
    help: AI coding tools to configure
    multiselect: true
    choices:
        - claude
        - codex
        - opencode
    default:
        - claude
        - codex
        - opencode

support_local_models:
    type: bool
    help: Include support local models.
    default: false

instructions_target:
    type: str
    help: Target directory for instruction files
    default: ".auxiliary/agents/standards"

_message_after_copy: |
    Project created from the agents-common template.

    Next: read the update runbook at
    https://github.com/emcd/agents-common/blob/master/documentation/applying-template-updates.md
    for the populate step and the update procedure you will use later.

_message_after_update: |
    Template update rendered. Read the update runbook at
    https://github.com/emcd/agents-common/blob/master/documentation/applying-template-updates.md
    before populating: review conflicts first, then run agentsmgr populate,
    and commit the update and the populate together.
